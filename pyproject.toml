[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raices-profundas"
version = "0.1.0"
description = "Análisis de humedad radicular SMAP L4 y señales de sequía en el Corredor Seco"
requires-python = ">=3.11"
dependencies = [
    "earthaccess>=0.16",
    "harmony-py",
    "geopandas>=1.0",
    "pandas>=2.0",
    "scipy>=1.12",
    "shapely>=2.0",
    "streamlit>=1.50",
    "plotly>=5.24",
    "numpy>=1.26",
    "rasterio>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
raices-profundas = "raices_profundas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
